spring:
  application:
    name: wallet-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYPOCKET_DB_URL}
    username: ${MYPOCKET_DB_USERNAME}
    password: ${MYPOCKET_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

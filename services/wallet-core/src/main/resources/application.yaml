spring:
  application:
    name: wallet-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYPOCKET_DB_URL}
    username: ${MYPOCKET_DB_USERNAME}
    password: ${MYPOCKET_DB_PASSWORD}
    hikari:
      data-source-properties:
        # PostgreSQL error details quote the offending values (e.g. a duplicate email); keep them out of logs (P1).
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

mypocket:
  admin:
    email: ${MYPOCKET_ADMIN_EMAIL:}
    password: ${MYPOCKET_ADMIN_PASSWORD:}
  security:
    jwt:
      secret: ${MYPOCKET_JWT_SECRET}
      time-to-live: 15m

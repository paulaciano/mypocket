spring:
  application:
    name: wallet-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYPOCKET_DB_URL}
    username: ${MYPOCKET_DB_USERNAME}
    password: ${MYPOCKET_DB_PASSWORD}
    hikari:
      data-source-properties:
        # PostgreSQL error details quote the offending values (e.g. a duplicate email); keep them out of logs (P1).
        logServerErrorDetail: false
        # L7, ADR-0004: waiting for a row lock fails after 5 s instead of piling up requests.
        options: "-c lock_timeout=5s"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

# The API description and Swagger UI are switched on only by the development profile (S13).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

mypocket:
  limits:
    # T5: maximum amount of one transfer or withdrawal.
    per-operation:
      ARS: 1000000.00
      USD: 5000.00
  admin:
    email: ${MYPOCKET_ADMIN_EMAIL:}
    password: ${MYPOCKET_ADMIN_PASSWORD:}
  provider:
    webhook-secret: ${MYPOCKET_PROVIDER_WEBHOOK_SECRET}
  security:
    jwt:
      secret: ${MYPOCKET_JWT_SECRET}
      time-to-live: 15m

# Checks run on Mondays and Thursdays (never more often than every 3 days)
# and only propose versions published at least 3 days earlier.
# Major versions of the Java and PostgreSQL images are ignored: moving to a new
# Java LTS or PostgreSQL major is a deliberate decision, not a routine update.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * 1,4"
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * 1,4"
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /services/wallet-core
    schedule:
      interval: cron
      cronjob: "0 6 * * 1,4"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * 1,4"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
